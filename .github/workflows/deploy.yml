name: CI/CD Kubernetes

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: Build e Push GHCR
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
          -t ghcr.io/gustavodevsenai/projeto-einfo:v1 .

      - name: Push
        run: |
          docker push ghcr.io/gustavodevsenai/projeto-einfo:v1


  deploy:
    name: Deploy VPS Kubernetes
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: gustavo
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /caminho/do/projeto
            kubectl apply -f k8s/