name: CI Docker

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build e Push GHCR
    runs-on: ubuntu-latest

    

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem
        run: |
          docker build \
            -t ghcr.io/gustavodevsenai/projeto-einfo:v1 .

      - name: Push da imagem
        run: |
          docker push ghcr.io/gustavodevsenai/projeto-einfo:v1